[project]
name = "lease-contract-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.31.0",
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.54",
    "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
    "factory-boy==3.3.3",
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
    "ty==0.0.83",
    "watchfiles==1.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "DTZ", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy reads its configuration from plain class attributes.
"src/models.py" = ["RUF012"]

[tool.ty.environment]
python-version = "3.14"
root = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.coverage.run]
source = ["src"]
omit = ["src/main.py"]

[tool.coverage.report]
include_namespace_packages = true
fail_under = 80
show_missing = true
