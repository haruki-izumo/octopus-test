services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: lease_contract_service
      POSTGRES_PASSWORD: lease_contract_service
      POSTGRES_DB: lease_contract_service
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lease_contract_service"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
