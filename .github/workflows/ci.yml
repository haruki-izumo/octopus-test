name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lease_contract_service
          POSTGRES_PASSWORD: lease_contract_service
          POSTGRES_DB: lease_contract_service
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lease_contract_service"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://lease_contract_service:lease_contract_service@localhost:5432/lease_contract_service
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Run migrations
        run: just migrate
      - name: Lint, format check and type check
        run: just check
      - name: Test
        run: just test
